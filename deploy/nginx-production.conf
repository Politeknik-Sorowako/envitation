server {
    listen 80;
    server_name envitation.politekniksorowako.ac.id;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name envitation.politekniksorowako.ac.id;

    # SSL certificates (will be replaced by certbot)
    ssl_certificate /etc/letsencrypt/live/envitation.politekniksorowako.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/envitation.politekniksorowako.ac.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Serve static frontend files
    root /home/nasrulhamid/envitation/src;
    index index.html;

    # Frontend routes - all under /frontend/
    location / {
        try_files $uri $uri/ =404;
    }

    # API proxy to backend Express
    # Strips /api/ prefix: /api/?action=verify -> /?action=verify on backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
